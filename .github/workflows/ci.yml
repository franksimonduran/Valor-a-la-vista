name: Validación Python y Streamlit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Comprobar sintaxis
        run: python -m compileall -q app.py valor_a_la_vista scripts tests
      - name: Ejecutar pruebas automatizadas sin API
        env:
          OPENAI_API_KEY: ""
          APP_REQUIRE_PASSWORD: "false"
          APP_ACCESS_PASSWORD: ""
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar arranque y archivos estáticos
        env:
          OPENAI_API_KEY: ""
          APP_REQUIRE_PASSWORD: "false"
          APP_ACCESS_PASSWORD: ""
        run: python scripts/smoke_test.py
